spring:
  application:
    name: state-service
  kafka:
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

aws:
  dynamodb:
    region: ${AWS_REGION:eu-west-3}
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}

logging:
  level:
    com.krizaldis: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true


homepulse:
  retry:
    max-attempts: 5
    initial-delay: 1s
    max-delay: 60s
    multiplier: 2.0
    jitter-factor: 0.20

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:homepulse-state-service}
    acks: all
    enable-idempotence: true
    max-in-flight-requests: 5
    retries: 2147483647
    delivery-timeout-ms: 120000
    request-timeout-ms: 30000
    linger-ms: 5
    batch-size: 32768
    topics:
      events: home.events
      retry: home.events.retry.1,home.events.retry.2,home.events.retry.3
      dlq: home.events.dlq

    consumer:
      events-group-id: homepulse-state-service
      retry-group-id: homepulse-state-retry