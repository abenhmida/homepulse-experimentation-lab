spring:
  application:
    name: state-service

aws:
  dynamodb:
    region: ${AWS_REGION:eu-west-3}
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}

logging:
  level:
    com.krizaldis: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

homepulse:
  retry:
    max-attempts: 5
    initial-delay: 1s
    max-delay: 60s
    multiplier: 2.0
    jitter-factor: 0.20